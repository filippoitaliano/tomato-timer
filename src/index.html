<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tomato timer</title>
    <link rel="stylesheet" href="style.css"/>
    <script type="text/javascript" src="logic.js"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
  </head>

  <body>
    <main class="app">
      <section class="card dialog">
        <div class="card-header">
          <div>
            <h1 class="card-title">Tomato timer</h1>
            <div class="card-subtitle" id="session-summary"></div>
          </div>
          <span class="tag">Filippo</span>
        </div>

        <div id="settings-dialog-content">
          <p class="settings-description">
            Welcome to the cutest tomato timer app. Take your time to set up the timings!
          </p>
          <div class="settings-form">
            <label class="settings-form-control">
              <span class="settings-form-control-label">Duration</span>
              <span class="field">
                <input type="number" min="1" id="work-duration-input"/>
                <span class="field-unit">min</span>
              </span>
            </label>
            <label class="settings-form-control">
              <span class="settings-form-control-label">Break</span>
              <span class="field">
                <input type="number" min="1" id="break-duration-input"/>
                <span class="field-unit">min</span>
              </span>
            </label>
            <label class="settings-form-control">
              <span class="settings-form-control-label">Times</span>
              <span class="field">
                <input type="number" min="1" id="work-times-input"/>
                <span class="field-unit">×</span>
              </span>
            </label>
            <button class="btn btn-green settings-form-save-button wjs" onclick="confirmSettingsForm()">
              That's ok!
            </button>
          </div>
        </div>

        <div id="settings-dialog-closed-content">
          <p class="settings-description">
            Good luck and have fun!
          </p>
          <button class="btn wjs" onclick="showSettingsForm()">
            Change settings
          </button>
        </div>
      </section>

      <section class="card main-content">
        <div class="analog-timer-wrapper" data-phase="idle">
          <svg class="timer-ring" viewBox="0 0 300 300" aria-hidden="true">
            <g id="timer-segments"></g>
          </svg>
          <div class="timer-readout">
            <div id="timer-time" class="timer-time">25:00</div>
            <div id="timer-phase" class="timer-phase">Ready</div>
          </div>
        </div>
        <div class="clock-controls">
          <button id="session-toggle-button" class="btn btn-tomato clock-control-button wjs" onclick="toggleTomatoSession()">
            Start
          </button>
          <button class="btn clock-control-button wjs" onclick="stopTomatoSession()">
            Abort
          </button>
        </div>
      </section>

      <footer class="app-footer">
        v<span id="app-version">dev</span>
      </footer>
    </main>
  </body>

</html>
